# App com Postgres embutido (localhost:5432). EasyPanel: prefira um serviço
# PostgreSQL no mesmo projeto + DATABASE_URL interno (veja README).
services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nandera:${POSTGRES_PASSWORD:-nandera}@127.0.0.1:5432/nandera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nandera}
      POSTGRES_LISTEN_ADDRESSES: "*"
    ports:
      - "3000:3000"
      - "5432:5432"
    volumes:
      - nandera_pg:/var/lib/postgresql/data

  # Só para `npm run dev` no host: docker compose --profile dev-db up -d db
  db:
    profiles: ["dev-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nandera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nandera}
      POSTGRES_DB: nandera
    ports:
      - "5432:5432"
    volumes:
      - nandera_pg_dev:/var/lib/postgresql/data

volumes:
  nandera_pg:
  nandera_pg_dev:
