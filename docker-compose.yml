services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nandera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nandera}
      POSTGRES_DB: nandera
    volumes:
      - nandera_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nandera -d nandera"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nandera:${POSTGRES_PASSWORD:-nandera}@db:5432/nandera
    ports:
      - "3000:3000"

volumes:
  nandera_pg:
